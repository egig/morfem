[package]
name = "morfem-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
morfem-engine = { version = "0.1.0", path = "../engine" }
morfem-sqlite = { version = "0.1.0", path = "../sqlite" }
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.1", features = ["v4"] }
